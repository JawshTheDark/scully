# Build installable packages for Linux, macOS and Windows and attach them to a
# GitHub Release.
#
# Packages, not archives: a .deb or .rpm declares its GTK dependency so the
# package manager fetches it, drops a .desktop file so the app appears in the
# launcher, and uninstalls cleanly. That matters most on a phone — FuriOS and
# Mobian are Debian, and an app that is not in the launcher may as well not be
# installed.
#
# Windows gets a real installer carrying its own GTK runtime, because there is
# no system GTK to depend on there. macOS gets a .app inside a .dmg with its
# libraries bundled.
#
# Voice is built in on Linux and macOS: a call button you cannot press is not a
# feature, so if the server offers voice the packaged client has to answer. That
# costs a prebuilt libwebrtc download and a much larger artefact, which is the
# honest price. cpal reaches the microphone through ALSA on Linux, so those
# packages declare it as a runtime dependency; without it the app installs
# cleanly and then fails the moment someone opens a call.
#
# Windows is the exception, for a toolchain reason spelled out at that job.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux: .deb and .rpm, for both architectures ──────────────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          # FuriPhone (FuriOS), Mobian, PinePhone, ARM laptops, Raspberry Pi.
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev rpm libasound2-dev clang librsvg2-bin
          cargo build --release -p scully --features voice

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage a filesystem tree
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          mkdir -p pkg/usr/bin \
                   pkg/usr/share/applications \
                   pkg/usr/share/icons/hicolor/scalable/apps \
                   pkg/usr/share/doc/scully
          install -m755 target/release/scully              pkg/usr/bin/scully
          install -m644 packaging/io.jawsh.Scully.desktop  pkg/usr/share/applications/io.jawsh.Scully.desktop
          install -m644 packaging/io.jawsh.Scully.svg      pkg/usr/share/icons/hicolor/scalable/apps/io.jawsh.Scully.svg
          install -m644 README.md                          pkg/usr/share/doc/scully/README.md
          # Sized PNGs beside the SVG: KDE's task manager (and some other
          # shells) resolve app icons from the sized dirs and skip
          # scalable-only themes, which left the window on a generic icon.
          for size in 32 48 64 128 256 512; do
            mkdir -p "pkg/usr/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/io.jawsh.Scully.svg \
              -o "pkg/usr/share/icons/hicolor/${size}x${size}/apps/io.jawsh.Scully.png"
          done

      - name: Build .deb
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          mkdir -p pkg/DEBIAN
          # Depends names the runtime so apt installs GTK for the user. That is
          # the entire reason to ship a package rather than a tarball.
          cat > pkg/DEBIAN/control <<EOF
          Package: scully
          Version: ${V}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-4-1 (>= 4.12), libasound2
          Recommends: gstreamer1.0-plugins-good, gstreamer1.0-libav
          Maintainer: JawshTheDark <noreply@users.noreply.github.com>
          Description: Native GTK4 client for a self-hosted Lurker IRC server
           Scully is a native desktop client for Lurker, the self-hosted
           always-on IRC client. It adapts to phone-sized screens, so it is usable on FuriOS,
           Mobian and other GTK4 handsets as well as on the desktop.
          EOF
          dpkg-deb --build --root-owner-group pkg "scully_${V}_${{ matrix.deb_arch }}.deb"

      - name: Build .rpm
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}
          cat > rpmbuild/SPECS/scully.spec <<EOF
          Name:           scully
          Version:        ${V}
          Release:        1
          Summary:        Native GTK4 client for a self-hosted Lurker IRC server
          License:        MPL-2.0
          URL:            https://github.com/JawshTheDark/scully
          Requires:       gtk4 >= 4.12
          Requires:       alsa-lib
          Suggests:       gstreamer1-plugins-good
          Suggests:       gstreamer1-libav
          %description
          Scully is a native desktop client for Lurker, the self-hosted
          always-on IRC client, with a single-pane layout on phone-sized screens.
          %install
          mkdir -p %{buildroot}
          cp -a %{_sourcedir}/tree/. %{buildroot}/
          %files
          /usr/bin/scully
          /usr/share/applications/io.jawsh.Scully.desktop
          /usr/share/icons/hicolor/scalable/apps/io.jawsh.Scully.svg
          /usr/share/icons/hicolor/*/apps/io.jawsh.Scully.png
          /usr/share/doc/scully/README.md
          EOF
          mkdir -p rpmbuild/SOURCES/tree
          cp -a pkg/usr rpmbuild/SOURCES/tree/
          rpmbuild --define "_topdir $PWD/rpmbuild" \
                   --define "_sourcedir $PWD/rpmbuild/SOURCES" \
                   --target "${{ matrix.rpm_arch }}" \
                   -bb rpmbuild/SPECS/scully.spec
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: |
            *.deb
            *.rpm

  # ── Arch: a .pkg.tar.zst ──────────────────────────────────────────────────
  #
  # Arch is neither .deb nor .rpm, so without this the one distro family the
  # maintainer actually runs had no package — and with no package nothing
  # installs the .desktop file, which is what a Wayland compositor matches the
  # window's app_id against to find the icon.
  #
  # x86_64 only: the archlinux image is x86_64, and Arch Linux ARM is a separate
  # distribution rather than another architecture of this one.
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # Before checkout: the action needs a working container, and pacman
      # brings the toolchain makepkg will expect to find already installed.
      - name: Install the toolchain
        run: pacman -Syu --noconfirm rust gtk4 alsa-lib clang pkgconf git librsvg

      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          cp packaging/PKGBUILD .
          # The committed pkgver tracks the last release; the tag being built is
          # authoritative, and it is also what names the source tarball.
          sed -i "s/^pkgver=.*/pkgver=${V}/" PKGBUILD
          # makepkg refuses to run as root, on purpose — a PKGBUILD is arbitrary
          # code and building it as root is how a typo removes /usr.
          useradd -m builder
          chown -R builder .
          sudo -u builder makepkg -f --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: '*.pkg.tar.zst'

  # ── macOS: a real .app inside a .dmg ──────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          brew install gtk4 pkg-config dylibbundler
          cargo build --release -p scully --features voice

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble Scully.app and a .dmg
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          APP="Scully.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources" "$APP/libs"
          cp target/release/scully "$APP/MacOS/scully"

          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Scully</string>
            <key>CFBundleDisplayName</key><string>Scully</string>
            <key>CFBundleIdentifier</key><string>io.jawsh.Scully</string>
            <key>CFBundleVersion</key><string>${V}</string>
            <key>CFBundleShortVersionString</key><string>${V}</string>
            <key>CFBundleExecutable</key><string>scully</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF

          # Copy every Homebrew dylib the binary reaches and rewrite its install
          # names, so the app runs on a Mac with no Homebrew at all.
          dylibbundler -od -b -x "$APP/MacOS/scully" -d "$APP/libs" -p @executable_path/../libs

          hdiutil create -volname "Scully" -srcfolder Scully.app -ov -format UDZO \
            "scully-${V}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*.dmg'

  # ── Windows: an installer that carries its own GTK ────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-nsis
      # NOT --features voice on Windows. The prebuilt libwebrtc for Windows is
      # built for MSVC, and webrtc-sys hands MSVC flags (/std:c++20, /EHsc) to
      # whatever compiler it finds — which under MSYS2 is g++, and g++ rejects
      # them. Building it would mean an MSVC Rust target, and GTK here comes
      # from MinGW; the two toolchains cannot be mixed in one binary. Windows
      # therefore ships everything except calls until GTK is sourced from
      # gvsbuild under MSVC.
      - run: cargo build --release -p scully

      - name: Resolve version
        id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage the runtime and build the installer
        run: |
          set -eu
          V="${{ steps.v.outputs.version }}"
          mkdir -p stage
          cp target/release/scully.exe stage/

          # ldd resolves transitively, so one pass collects the whole GTK stack.
          ldd stage/scully.exe | grep -i '/mingw64/' | awk '{print $3}' | sort -u \
            | while read -r dll; do cp -u "$dll" stage/; done

          # GTK will not start without its compiled settings schemas, and reads
          # image formats through gdk-pixbuf's loader modules — without those,
          # inline images are blank.
          mkdir -p stage/share/glib-2.0/schemas
          cp /mingw64/share/glib-2.0/schemas/*.xml stage/share/glib-2.0/schemas/ 2>/dev/null || true
          glib-compile-schemas stage/share/glib-2.0/schemas
          if [ -d /mingw64/lib/gdk-pixbuf-2.0 ]; then
            cp -r /mingw64/lib/gdk-pixbuf-2.0 stage/lib/
          fi

          cat > scully.nsi <<EOF
          !include "MUI2.nsh"
          Name "Scully"
          OutFile "scully-${V}-windows-x64-setup.exe"
          Unicode True
          InstallDir "\$LOCALAPPDATA\\Scully"
          RequestExecutionLevel user
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
            SetOutPath "\$INSTDIR"
            File /r "stage\\*.*"
            CreateShortcut "\$SMPROGRAMS\\Scully.lnk" "\$INSTDIR\\scully.exe"
            CreateShortcut "\$DESKTOP\\Scully.lnk" "\$INSTDIR\\scully.exe"
            WriteUninstaller "\$INSTDIR\\uninstall.exe"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Scully" \\
              "DisplayName" "Scully"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Scully" \\
              "UninstallString" "\$INSTDIR\\uninstall.exe"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Scully" \\
              "DisplayVersion" "${V}"
          SectionEnd
          Section "Uninstall"
            Delete "\$SMPROGRAMS\\Scully.lnk"
            Delete "\$DESKTOP\\Scully.lnk"
            RMDir /r "\$INSTDIR"
            DeleteRegKey HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Scully"
          SectionEnd
          EOF
          makensis scully.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*-setup.exe'

  release:
    needs: [linux, arch, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Full history: the notes are built from commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src
      # Real release notes, not just "Full Changelog: vX...vY". The release
      # body is also what GitHub serves as og:description, so it is what every
      # link-preview card (IRC bridges, Scully's own cards) shows for the
      # release URL — a bare compare-link there reads as an empty release.
      # The tag's annotation is the headline; the commit subjects since the
      # previous tag are the bullets. Commit messages here are written to be
      # readable, so this is cheap to keep good.
      - name: Compose release notes
        run: |
          set -eu
          cd src
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            git tag -l --format='%(contents:subject)' "$TAG"
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since ${PREV}"
              git log --no-merges --format='- %s' "${PREV}..${TAG}"
            else
              git log --no-merges --format='- %s' "$TAG"
            fi
          } > ../NOTES.md
          cat ../NOTES.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Scully ${{ github.event.inputs.tag || github.ref_name }}
          # Published outright, not drafted. A release nobody publishes is an
          # invisible release, and this repo cuts frequent point releases.
          draft: false
          make_latest: true
          body_path: NOTES.md
          # Appends the compare link and contributors under the real notes.
          generate_release_notes: true
          files: artifacts/**/*
