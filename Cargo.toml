[workspace]
resolver = "2"
members = ["crates/lurker-proto", "crates/lurker-client", "crates/scully"]

[workspace.package]
version = "0.1.27"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/JawshTheDark/scully"

[workspace.dependencies]
lurker-proto = { path = "crates/lurker-proto" }
lurker-client = { path = "crates/lurker-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "=0.3.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
